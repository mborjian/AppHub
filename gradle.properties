org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# sdkDownload would fetch from dl.google.com (blocked here); missing packages: python tools/sdkget.py "platforms;android-36"
android.builder.sdkDownload=false

kotlin.code.style=official

# the compile daemon's socket round trip is flaky in offline sandboxes; in-process always works
kotlin.compiler.execution.strategy=in-process

org.gradle.tooling.parallel=true
