org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP's SDK auto-download fetches its manifests from dl.google.com, which is
# blocked on this network (Google 404s everything) - every build would stall
# on it. Missing SDK packages are installed with:
#     python tools/sdkget.py "platforms;android-36"
# Delete this line on machines that can reach Google to re-enable it.
android.builder.sdkDownload=false

kotlin.code.style=official

# The Kotlin compile daemon needs a socket round trip that is flaky in some
# sandboxed/offline environments; compiling in-process always works.
kotlin.compiler.execution.strategy=in-process

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
