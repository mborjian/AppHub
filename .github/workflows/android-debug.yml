# Verifies on every push that the split-out repo still builds, so a dependency
# that stops resolving fails here instead of on the unit.
name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version comes from the git tags (see app/build.gradle.kts), so a
          # build here reads them the way a release does instead of falling back
          # to the stand-in number.
          fetch-depth: 0
          fetch-tags: true

      # The JDK and the SDK packages, pinned in one place for both workflows.
      - name: Set up the JDK and the Android SDK
        uses: ./.github/actions/android-setup

      - name: Build the debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
