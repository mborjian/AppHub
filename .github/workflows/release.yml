# Publishes one signed, universal APK whenever a vX.Y.Z tag is pushed.
#
# The tag is the version: app/build.gradle.kts reads versionName and versionCode
# back out of the checkout, so a release is the tag and nothing else. Before
# anything is published the APK is installed on an emulator and its launcher
# activity has to reach the front - the build proves the file, the emulator
# proves the app.
#
# The app has no native libraries and no density-specific resources, so an ABI
# or density split could not leave anything out - a single APK installs on every
# arm and x86 device from Android 9 (minSdk 28) up.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version comes from the tags, and --generate-notes needs the
          # history and the older ones.
          fetch-depth: 0
          fetch-tags: true

      # The JDK and the SDK packages, pinned in one place for both workflows.
      - name: Set up the JDK and the Android SDK
        uses: ./.github/actions/android-setup

      # The tag *is* the version, and Gradle reads it back out of this checkout.
      # A tag that is not a plain vX.Y.Z would build an APK whose versionName is
      # not the release name, so it is refused here, before the build.
      - name: Check the tag names a version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z tag - push one like v1.0.1."
            exit 1
          fi

          # The same lookup the build makes, run here so a checkout that cannot
          # see the tag says so now instead of after a build and an emulator boot.
          resolved=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' || true)
          if [ "$resolved" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe reads '${resolved:-nothing}' here, not $GITHUB_REF_NAME - the APK would not carry the tag's version."
            exit 1
          fi
          echo "releasing ${GITHUB_REF_NAME#v}"

      # Nothing signed ever lives in the repository: the keystore arrives as a
      # secret and is written to the runner's temp directory for this job only.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the RELEASE_KEYSTORE_BASE64 secret is not set - see the README's release section."
            exit 1
          fi

          # A secret set from a file tends to carry more than the payload: a
          # byte-order mark, NUL bytes from a UTF-16 redirect, or the
          # `-----BEGIN ...-----` lines certutil wraps base64 in. Those are
          # stripped off here; anything else is reported instead of guessed at.
          clean=$(printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\000' \
            | tr -d '\n\r \t' \
            | tr -d '\357\273\277' \
            | sed 's/^.*-----BEGIN[^-]*-----//' \
            | sed 's/-----END.*$//')

          # `base64 -d` wants the length to be a multiple of four; an unpadded
          # encoding (PowerShell writes one without `=` only when it is exact, a
          # few other tools always do) is padded here rather than refused.
          case $(( ${#clean} % 4 )) in
            2) clean="$clean==" ;;
            3) clean="$clean=" ;;
          esac

          outside=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
          if [ "$outside" -ne 0 ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 does not decode as base64 - $outside of its ${#clean} characters are outside the alphabet - so it is not the base64 of the .jks file. Re-set it from that file, see the README's release section."
            exit 1
          fi

          printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      # A keystore, a password and an alias that do not match each other would
      # otherwise be found out by a Gradle build - or by an emulator boot - a few
      # minutes from now. keytool answers here instead, and prints nothing of it.
      - name: Check the keystore opens with those secrets
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "::error::RELEASE_KEYSTORE_PASSWORD is not set."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::RELEASE_KEY_ALIAS is not set."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the decoded keystore does not open with RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS - a stray newline or byte-order mark at the end of either one would do this."; exit 1; }
          echo "the keystore opens and holds that alias"

      - name: Build the signed release APK
        env:
          APPHUB_KEYSTORE: ${{ runner.temp }}/release.jks
          APPHUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          APPHUB_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          APPHUB_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify the signature and the version, and collect the APK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          aapt2=$(ls "$sdk"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          badging=$("$aapt2" dump badging "$apk")
          echo "$badging" | sed -n '1,3p'

          # The tag is the version, and this is the proof the build read it: an
          # APK that disagrees with the tag is not the release being published.
          built=$(sed -n "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          if [ "$built" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::the APK says versionName $built while the tag says ${GITHUB_REF_NAME#v} - the build did not see the tag (a shallow checkout?)."
            exit 1
          fi

          mkdir -p dist
          name="AppHub-${GITHUB_REF_NAME#v}-universal.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" | tee "$name.sha256")
          echo "RELEASE_APK=dist/$name" >> "$GITHUB_ENV"

      # The runner exposes /dev/kvm but not to the user the job runs as, and an
      # emulator without it falls back to software emulation: it did boot that
      # way, in six minutes, with its settings service never coming up - and the
      # emulator's own setup then failed on the animation settings before the
      # check below could run.
      - name: Give the emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Everything above proves the file is a signed APK of the right version.
      # This is what proves it is the app: it goes onto an emulator, and the
      # launcher activity has to reach the front and stay there. Nothing is
      # published until it does - an APK that cannot start is not a release.
      - name: Install the APK on an emulator and prove the launcher starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 11 with Google APIs: it boots headless on the runner's KVM and
          # has no setup wizard to sit in front of the app.
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh tools/smoke-test-apk.sh "$RELEASE_APK"

      # The screenshot and the activity dump that answer was read from, kept even
      # when the check failed: that is the difference between "it did not start"
      # and a guess about why.
      - name: Keep the emulator run as evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ github.ref_name }}
          path: smoke-test/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.apk dist/*.sha256
