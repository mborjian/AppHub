name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up the JDK and the Android SDK
        uses: ./.github/actions/android-setup

      - name: Check the tag names a version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z tag - push one like v1.0.1."
            exit 1
          fi

          resolved=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' || true)
          if [ "$resolved" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe reads '${resolved:-nothing}' here, not $GITHUB_REF_NAME - the APK would not carry the tag's version."
            exit 1
          fi
          echo "releasing ${GITHUB_REF_NAME#v}"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the RELEASE_KEYSTORE_BASE64 secret is not set - see the README's release section."
            exit 1
          fi

          clean=$(printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\000' \
            | tr -d '\n\r \t' \
            | tr -d '\357\273\277' \
            | sed 's/^.*-----BEGIN[^-]*-----//' \
            | sed 's/-----END.*$//')

          case $(( ${#clean} % 4 )) in
            2) clean="$clean==" ;;
            3) clean="$clean=" ;;
          esac

          outside=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
          if [ "$outside" -ne 0 ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 does not decode as base64 - $outside of its ${#clean} characters are outside the alphabet - so it is not the base64 of the .jks file. Re-set it from that file, see the README's release section."
            exit 1
          fi

          printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Check the keystore opens with those secrets
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "::error::RELEASE_KEYSTORE_PASSWORD is not set."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::RELEASE_KEY_ALIAS is not set."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the decoded keystore does not open with RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS - a stray newline or byte-order mark at the end of either one would do this."; exit 1; }
          echo "the keystore opens and holds that alias"

      - name: Build the signed release APK
        env:
          APPHUB_KEYSTORE: ${{ runner.temp }}/release.jks
          APPHUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          APPHUB_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          APPHUB_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify the signature and the version, and collect the APK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          aapt2=$(ls "$sdk"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"

          pinned=$(sed -n 's/.*"\([0-9a-f]\{64\}\)".*/\1/p' app/src/main/java/com/mimskydo/apphub/Updater.kt)
          signed=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: *//p' | tail -1)
          if [ "$pinned" != "$signed" ]; then
            echo "::error::this APK is signed by $signed while Updater.kt pins $pinned - a build already on the unit could not verify it."
            exit 1
          fi
          echo "signed by the key the update screen pins: $signed"

          badging=$("$aapt2" dump badging "$apk")
          echo "$badging" | sed -n '1,3p'

          built=$(sed -n "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          if [ "$built" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::the APK says versionName $built while the tag says ${GITHUB_REF_NAME#v} - the build did not see the tag (a shallow checkout?)."
            exit 1
          fi

          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          handoff=$(printf '%s\n' "$manifest" | awk -v want="$pkg.handoff" '
            function flush() {
                if (pending != "" && index(pending, want) > 0) printf "%s", pending
                pending = ""
            }
            /^[[:space:]]*E: / {
                match($0, /^[[:space:]]*/)
                if (pending != "" && RLENGTH <= pending_indent) flush()
                pending_indent = RLENGTH
                pending = pending $0 "\n"
                next
            }
            { if (pending != "") pending = pending $0 "\n" }
            END { flush() }
          ')
          if [ -z "$handoff" ]; then
            echo "::error::the built manifest declares no $pkg.handoff provider - a file could not leave the app."
            exit 1
          fi
          printf '%s\n' "$handoff"
          case "$handoff" in
            *'exported(0x01010010)=false'*) ;;
            *) echo "::error::the hand-off provider is exported in the built APK."; exit 1 ;;
          esac
          case "$handoff" in
            *'grantUriPermissions(0x0101001b)=true'*) ;;
            *) echo "::error::the hand-off provider grants no per-intent URI permission."; exit 1 ;;
          esac
          case "$handoff" in
            *FILE_PROVIDER_PATHS*)
              echo "::error::the hand-off provider has a paths file behind it - it can serve more than the one file it was handed."
              exit 1 ;;
          esac
          echo "the hand-off provider is one file per token, read-only and not exported"

          mkdir -p dist
          name="AppHub-${GITHUB_REF_NAME#v}-universal.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" | tee "$name.sha256")
          echo "RELEASE_APK=dist/$name" >> "$GITHUB_ENV"

      - name: Give the emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the APK on an emulator and prove the launcher starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh tools/smoke-test-apk.sh "$RELEASE_APK"

      - name: Keep the emulator run as evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ github.ref_name }}
          path: smoke-test/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.apk dist/*.sha256
